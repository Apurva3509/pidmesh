name: Feature request
description: Propose a focused coordination or memory capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Coordination problem
      description: Describe the multi-agent failure or friction this would solve.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: Explain how many agents are involved and how they coordinate today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest interface or protocol change that would help.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Local-first constraints
      options:
        - label: The proposal can work without a required cloud service.
          required: true
        - label: The proposal preserves workspace isolation.
          required: true
