[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidmesh"
version = "0.1.0"
description = "Local process-aware memory and coordination for concurrent AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Apurva3509" }]
keywords = ["agents", "ai", "coordination", "mcp", "memory", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.1.1,<3"]

[project.scripts]
pidmesh = "pidmesh.cli:main"
pidmesh-mcp = "pidmesh.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Apurva3509/pidmesh"
Issues = "https://github.com/Apurva3509/pidmesh/issues"

[dependency-groups]
dev = [
  "mcp>=2.1.1,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pidmesh"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["pidmesh"]

[tool.coverage.report]
fail_under = 85
show_missing = true
