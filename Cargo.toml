[package]
name = "pidmesh"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
description = "Local process-aware memory and coordination for concurrent AI agents"
license = "MIT"
repository = "https://github.com/Apurva3509/pidmesh"
keywords = ["agents", "ai", "coordination", "mcp", "sqlite"]
categories = ["command-line-utilities", "database"]

# A deterministic stand-in for an agent provider (`claude`, `codex`), so the WebSocket terminal
# in `src/ide.rs` can be tested without either one installed. It has to be a `[[bin]]` rather
# than an example because only a bin gets a `CARGO_BIN_EXE_*` path that `cargo test` guarantees
# is built: `cargo test --all-targets` compiles examples as test harnesses, which are not
# runnable as the program itself. Its source lives under `tests/` so nothing but a test ever
# reaches for it.
[[bin]]
name = "pidmesh-fake-provider"
path = "tests/support/fake_provider.rs"
doc = false
test = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
nix = { version = "0.31", features = ["process", "signal"] }
portable-pty = "0.9.0"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unnecessary_wraps = "allow"
unused_async_trait_impl = "allow"
