[package]
name = "pidmesh"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Local process-aware memory and coordination for concurrent AI agents"
license = "MIT"
repository = "https://github.com/Apurva3509/pidmesh"
keywords = ["agents", "ai", "coordination", "mcp", "sqlite"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
nix = { version = "0.31", features = ["process", "signal"] }
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.26", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unnecessary_wraps = "allow"
unused_async_trait_impl = "allow"
